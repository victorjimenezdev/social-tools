name: social-tools
recipe: node
config:
  node: 20
services:
  appserver:
    build_as_root: true
    build:
      - corepack enable
      - npm install -g pnpm@8

# Expose common project commands via Lando tooling
# e.g. `lando dev` or `lando lint`
tooling:
  pnpm:
    service: appserver
    cmd: pnpm
  dev:
    service: appserver
    cmd: pnpm --filter site dev
  build:
    service: appserver
    cmd: pnpm --filter site build
  lint:
    service: appserver
    cmd: pnpm lint
  test:
    service: appserver
    cmd: pnpm test
  typecheck:
    service: appserver
    cmd: pnpm exec tsc --noEmit -p apps/site/tsconfig.json
